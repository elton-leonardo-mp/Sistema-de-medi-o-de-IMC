<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutricionista Wiviane Marques - Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=nutrition"
    />
  </head>
  <body>
    <header>
      <span class="material-symbols-outlined"> nutrition </span>
      <h1>Sistema IMC</h1>
      <span class="material-symbols-outlined"> nutrition </span>
    </header>
    <main>
      <section id="calculadora" class="calculator">
        <h1 id="primeiroh1">Calculadora de IMC</h1>
        <form>
          <label for="altura">Altura (m):</label>
          <input type="number" id="altura" step="0.01" />
          <label for="peso">Peso (kg):</label>
          <input type="number" id="peso" step="0.1" />

          <div id="botoes">
            <button type="button" id="calcular">Calcular</button>
            <button type="button" id="limpar">Limpar</button>
          </div>
        </form>
      </section>
      <section id="sobre" class="about">
        <h1>Resultado:</h1>
        <p id="resultado"></p>
      </section>
    </main>

    <footer>
      <div id="rodape">
        <p>Dr. Wiviane Marques</p>
        <p>CRN: 28718</p>
        <a
          href="https://www.instagram.com/nutricionistawiviane?igsh=OTFiMjEyd2Z5dHo3"
          target="_blank"
          >Instagram</a
        >
        <a href="https://wa.me/+5581985654664" target="_blank">WhatsApp</a>
        <div id="leo">
          <p>Developer: Leonardo</p>
        </div>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
